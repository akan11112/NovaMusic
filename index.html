<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaMusic</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #212121;
            --accent-color: #ff0033;
            --text-primary: #ffffff;
            --text-secondary: #aaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            background: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
            gap: 16px;
        }
        .section-title { font-size: 16px; color: var(--text-secondary); margin-bottom: 8px; }
        .playlist-box {
            background: var(--surface-color);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input[type="text"] {
            background: #121212;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            width: 100%;
        }
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .track-item {
            background: var(--surface-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-bar {
            background: var(--surface-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid #333;
        }
        .player-info { font-size: 14px; font-weight: bold; }
        .controls { display: flex; justify-content: center; gap: 20px; align-items: center; }
        .ctrl-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <span>NovaMusic</span>
    </header>

    <div class="main-container">
        <div class="playlist-box">
            <div class="section-title">Playlist / Müzik Ekle</div>
            <input type="text" id="trackUrl" placeholder="YouTube Video URL veya Şarkı Adı">
            <button class="btn" onclick="addTrack()">Listeye Ekle</button>
        </div>

        <div>
            <div class="section-title">Oynatma Listesi</div>
            <div class="track-list" id="trackList">
                <div class="track-item">
                    <span>Örnek Parça - NovaMusic</span>
                    <button class="ctrl-btn" onclick="playSample()">▶</button>
                </div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="player-info" id="nowPlaying">Çalınan: Yok</div>
        <div class="controls">
            <button class="ctrl-btn">⏮</button>
            <button class="ctrl-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn">⏭</button>
        </div>
    </div>

    <script>
        function addTrack() {
            const input = document.getElementById('trackUrl');
            if(!input.value) return;
            
            const list = document.getElementById('trackList');
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `<span>${input.value}</span><button class="ctrl-btn" onclick="playTrack('${input.value}')">▶</button>`;
            list.appendChild(item);
            input.value = '';
        }

        function playSample() {
            document.getElementById('nowPlaying').innerText = "Çalınan: Örnek Parça - NovaMusic";
        }

        function playTrack(name) {
            document.getElementById('nowPlaying').innerText = "Çalınan: " + name;
        }

        function togglePlay() {
            alert('Oynat / Duraklat tetiklendi.');
        }
    </script>
</body>
</html>
